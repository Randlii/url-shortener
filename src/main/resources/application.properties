# Базовый адрес, который подставляется перед кодом короткой ссылки
shortener.base-url=clck.ru/
# Длина кода короткой ссылки (символы Base62)
shortener.code-length=6
# Время жизни ссылки в часах (задаётся системой, а не пользователем)
shortener.ttl-hours=24
# Лимит переходов по умолчанию, если пользователь его не указал
shortener.default-max-clicks=10
# Максимально допустимый лимит переходов, который может задать пользователь
shortener.max-allowed-clicks=1000
# Как часто фоновая задача удаляет протухшие ссылки (в секундах)
shortener.cleanup-interval-seconds=60
